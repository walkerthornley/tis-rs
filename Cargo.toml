[package]
name = "tis-rs"
version = "0.0.1"
publish = false
authors = ["Walker Thornley <walker.thornley@telco.in>"]
edition = "2024"

[dependencies]
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0"
tokio = { version = "1.21.2", features = ["rt"] }
tracing = "0.1.37"

[dev-dependencies]
tokio = { version = "1.21.2", features = ["macros", "rt"] }
